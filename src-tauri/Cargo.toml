[package]
name = "tunnelwarden-tauri"
build = "build.rs"
version = "0.2.2"
edition.workspace = true
license.workspace = true

[lib]
name = "tunnelwarden_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tunnelwarden-core = { path = "../crates/tunnelwarden-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
log = "0.4"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_HiDpi"] }
