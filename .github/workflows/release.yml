name: Windows Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        default: v0.2.4
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Prepare reproducible inputs
        shell: pwsh
        run: |
          ./scripts/verify-release.ps1 -Tag $env:RELEASE_TAG
          rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.94.1
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run licenses
      - name: Cache pinned Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2, immutable commit
        with:
          shared-key: windows-1.94.1
          cache-on-failure: true
      - name: Build and source checks
        shell: pwsh
        run: ./scripts/check.ps1 -Frontend
      - name: Build Windows installers
        run: npm run bundle
      - name: Verify and collect installers
        shell: pwsh
        run: ./scripts/collect-release.ps1 -Tag $env:RELEASE_TAG
      - name: Publish verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --verify-tag --draft --title "TunnelWarden $env:RELEASE_TAG" --generate-notes
            if ($LASTEXITCODE) { throw 'Release creation failed' }
          }
          gh release upload $env:RELEASE_TAG release-assets/* --clobber
          if ($LASTEXITCODE) { throw 'Artifact upload failed' }
          gh release edit $env:RELEASE_TAG --draft=false
          if ($LASTEXITCODE) { throw 'Release publication failed' }
