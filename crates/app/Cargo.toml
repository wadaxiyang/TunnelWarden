[package]
name = "tunnelwarden"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
config-store = { path = "../config-store" }
gpui-kit = "=0.6.6"
tunnel-domain = { path = "../tunnel-domain" }
tunnel-core = { path = "../tunnel-core" }
tokio.workspace = true
zeroize.workspace = true
rand = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Security", "Win32_System_Threading"] }
tray-icon = "0.24.2"

[dev-dependencies]
gpui-kit = { version = "=0.6.6", features = ["test-support"] }
