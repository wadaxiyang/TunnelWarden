[workspace]
members = ["crates/tunnelwarden-core", "src-tauri"]
resolver = "2"
exclude = ["vendor/oryxis-ssh"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
# Upstream SSH engine. Do not replace with a handwritten equivalent.
oryxis-core = { git = "https://github.com/wilsonglasser/oryxis.git", rev = "16ad2af83b424780ff60b6420a6c20a3b30c7143", package = "oryxis-core" }
oryxis-ssh = { git = "https://github.com/wilsonglasser/oryxis.git", rev = "16ad2af83b424780ff60b6420a6c20a3b30c7143", package = "oryxis-ssh" }
oryxis-vault = { git = "https://github.com/wilsonglasser/oryxis.git", rev = "16ad2af83b424780ff60b6420a6c20a3b30c7143", package = "oryxis-vault" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

# Same pinned source, minimally instrumented for per-rule payload counters.
[patch."https://github.com/wilsonglasser/oryxis.git"]
oryxis-ssh = { path = "vendor/oryxis-ssh" }
