[workspace]
members = ["crates/tunnel-domain", "crates/tunnel-core", "crates/ssh-engine", "crates/forwarding"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
russh = { version = "=0.63.3", default-features = false, features = ["ring"] }
zeroize = "1"
tracing = "0.1"
