[workspace]
members = ["crates/tunnel-domain", "crates/tunnel-core", "crates/ssh-engine", "crates/forwarding", "crates/config-store", "crates/app"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.98"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "time", "io-util", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
russh = { version = "=0.63.3", default-features = false, features = ["ring"] }
zeroize = "1"
tracing = "0.1"
toml = "=0.9.12"

[patch.crates-io]
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
